[package]
name = "raxo-email"
version = "0.4.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "Raxo Email backend (Rust) — RaxoSentinel-scanned form-to-email gateway"

[lib]
name = "raxo_email"
path = "src/lib.rs"

[[bin]]
name = "raxo-api"
path = "src/bin/raxo-api.rs"

[[bin]]
name = "raxo-worker"
path = "src/bin/raxo-worker.rs"

[[bin]]
name = "raxo-migrate"
path = "src/bin/raxo-migrate.rs"

[[bin]]
name = "raxo-cli"
path = "src/bin/raxo-cli.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
multer = "3"
futures-util = "0.3"
bytes = "1"
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
subtle = "2"
url = "2"
regex = "1"
unicode-normalization = "0.1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory"] }
hickory-resolver = "0.26"
rsa = { version = "0.9", features = ["pem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# RSA key generation/signing is very slow unoptimized; keep debug builds and tests fast.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
