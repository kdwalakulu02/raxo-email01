<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get in Touch — Raxo Email Form</title>
    <style>
      :root {
        --bg: #090d16;
        --card-bg: #111827;
        --card-border: #1f293d;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
        --input-bg: #0b1120;
        --input-border: #374151;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family: var(--font);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .form-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        padding: 2.5rem;
        max-width: 540px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      h2 {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
      }
      p.desc {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .form-group {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: #e5e7eb;
      }
      input[type="text"],
      input[type="email"],
      textarea,
      select {
        width: 100%;
        padding: 0.75rem 1rem;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 0.5rem;
        color: white;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input[type="text"]:focus,
      input[type="email"]:focus,
      textarea:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      }
      button[type="submit"] {
        width: 100%;
        padding: 0.875rem 1.5rem;
        background: var(--primary-gradient);
        color: white;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        margin-top: 1rem;
        transition:
          opacity 0.15s,
          transform 0.1s;
      }
      button[type="submit"]:hover {
        opacity: 0.95;
        transform: translateY(-1px);
      }
      button[type="submit"]:active {
        transform: translateY(0);
      }
      .privacy-tag {
        text-align: center;
        margin-top: 1.25rem;
        color: #6b7280;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="form-card">
      <h2>Get in Touch</h2>
      <p class="desc">Send us a message and we will respond directly to your email.</p>

      <!-- Replace YOUR_FORM_ID with your generated Form ID -->
      <form action="https://forms.yourdomain.com/f/YOUR_FORM_ID" method="POST">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="Alex Smith" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="alex@example.com" />
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="_subject" placeholder="Project Inquiry" />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            placeholder="How can we help you?"
          ></textarea>
        </div>

        <!-- Honeypot spam field: unseen by human visitors -->
        <input type="text" name="_honey" style="display: none" tabindex="-1" autocomplete="off" />

        <button type="submit">Send Message</button>
        <div class="privacy-tag">🔒 End-to-end encrypted submission delivery via Raxo Email</div>
      </form>
    </div>
  </body>
</html>
